<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OSM Drive</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;font-family:system-ui,sans-serif;color:#fff}
#g{position:fixed;inset:0;width:100%;height:100%}
.glass{background:rgba(20,30,50,.42);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);border-radius:16px}
#hud{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#spd{padding:6px 14px;text-align:center;min-width:110px}#kmh{font-size:36px;font-variant-numeric:tabular-nums}
#spd small{opacity:.7}#gear{font-size:18px}
#mm{width:130px;height:130px;border-radius:50%}
#tools{position:fixed;left:10px;top:calc(max(10px,env(safe-area-inset-top)) + 92px);padding:8px;display:flex;flex-direction:column;gap:6px;width:min(230px,52vw);font-size:12px}
#tools div{display:flex;gap:6px;align-items:center}
input{-webkit-user-select:text;user-select:text;touch-action:auto;flex:1;min-width:0;padding:7px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-size:14px}
#go,#cm{padding:7px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(80,160,255,.45);color:#fff;font-size:12px;font-weight:600}
#ctl{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.grp{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#ctl button{width:74px;height:74px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;background:rgba(20,30,50,.45);border:1px solid rgba(255,255,255,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#ctl button.on{background:rgba(80,160,255,.7)}
button[data-k=G]{width:90px!important;height:90px!important;background:rgba(40,170,90,.5)!important}
button[data-k=B]{background:rgba(210,60,60,.5)!important}
</style></head><body>
<canvas id="g"></canvas>
<div id="hud">
 <div id="spd" class="glass"><b id="kmh">0</b> <small>km/h</small><div>Gear <b id="gear">N</b></div></div>
 <canvas id="mm" class="glass" width="260" height="260"></canvas>
</div>
<div id="tools" class="glass">
 <div><input id="ll" value="40.7580, -73.9855" placeholder="lat, lon" autocomplete="off"><button id="go">Go</button></div>
 <div><button id="cm">📷 Chase</button><span id="st"></span></div>
</div>
<div id="ctl">
 <div class="grp"><button data-k="L">◀</button><button data-k="R">▶</button></div>
 <div class="grp"><button data-k="H">HAND</button><button data-k="B">BRAKE</button><button data-k="G">GAS</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),K={L:0,R:0,G:0,B:0,H:0};
const R=new THREE.WebGLRenderer({canvas:$('g'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const SKY=0x9fc4e8,S=new THREE.Scene();S.background=new THREE.Color(SKY);S.fog=new THREE.Fog(SKY,150,600);
const cam=new THREE.PerspectiveCamera(65,1,.3,1500);
S.add(new THREE.HemisphereLight(0xffffff,0x556655,1));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(80,150,60);S.add(sun);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();addEventListener('contextmenu',e=>e.preventDefault());

function mkCar(c){const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:c});
 const b=new THREE.Mesh(new THREE.BoxGeometry(1.9,.7,4.2),m);b.position.y=.65;g.add(b);
 const t=new THREE.Mesh(new THREE.BoxGeometry(1.6,.6,2.1),new THREE.MeshLambertMaterial({color:0x223344}));t.position.set(0,1.25,.2);g.add(t);
 const wg=new THREE.CylinderGeometry(.35,.35,.3,10),wm=new THREE.MeshLambertMaterial({color:0x111111});
 for(const x of[-1,1])for(const z of[-1.3,1.3]){const w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x*.95,.35,z);g.add(w)}
 return g}
const P=mkCar(0xe53935);S.add(P);
// heading h: forward=(sin h,-cos h); x=east, z=south (north=-z)
const c={x:0,z:0,h:0,vx:0,vz:0,st:0,snap:1};
let W,roads=[],blds=[],ai=[];

function parse(lat,lon,els){const kx=111320*Math.cos(lat*Math.PI/180),kz=110540,out=[];
 for(const e of els){if(!e.geometry||e.geometry.length<2)continue;
  const p=e.geometry.map(g=>[(g.lon-lon)*kx,-(g.lat-lat)*kz]),t=e.tags||{};
  if(t.highway)out.push({r:1,p,w:{motorway:14,trunk:12,primary:11,secondary:9,tertiary:8}[t.highway]||6});
  else if(t.building&&e.geometry.length>3)out.push({b:1,p,h:parseFloat(t.height)||(parseFloat(t['building:levels'])||2+e.id%4)*3.2})}
 return out}
function fallback(){const o=[];
 for(let i=-3;i<=3;i++){o.push({r:1,w:9,p:[[i*70,-250],[i*70,250]]});o.push({r:1,w:9,p:[[-250,i*70],[250,i*70]]})}
 for(let i=-3;i<3;i++)for(let j=-3;j<3;j++){const x=i*70+35,z=j*70+35,s=20+((i*7+j*3)&7)*2;
  o.push({b:1,h:8+((i*5+j*11)&15)*2,p:[[x-s/2,z-s/2],[x+s/2,z-s/2],[x+s/2,z+s/2],[x-s/2,z+s/2],[x-s/2,z-s/2]]})}
 return o}

function build(items){
 if(W)S.remove(W);W=new THREE.Group();S.add(W);roads=[];blds=[];
 const g=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshLambertMaterial({color:0x4a6b45}));g.rotation.x=-Math.PI/2;W.add(g);
 const pos=[],bm=[0xb9b2a5,0xa7b3c2,0xc9a98f,0x9aa59a].map(k=>new THREE.MeshLambertMaterial({color:k}));let nb=0;
 for(const it of items){
  if(it.r){it.sl=[];it.len=0;
   for(let i=0;i<it.p.length-1;i++){const[x1,z1]=it.p[i],[x2,z2]=it.p[i+1],L=Math.hypot(x2-x1,z2-z1);it.sl.push(L);it.len+=L;if(L<.1)continue;
    const nx=-(z2-z1)/L*it.w/2,nz=(x2-x1)/L*it.w/2,y=.05;
    pos.push(x1+nx,y,z1+nz,x1-nx,y,z1-nz,x2-nx,y,z2-nz,x1+nx,y,z1+nz,x2-nx,y,z2-nz,x2+nx,y,z2+nz)}
   roads.push(it)}
  else if(it.b&&nb<350){nb++;const q=it.p.slice(0,-1),sh=new THREE.Shape(q.map(a=>new THREE.Vector2(a[0],-a[1])));
   const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:it.h,bevelEnabled:false}),bm[nb%4]);m.rotation.x=-Math.PI/2;W.add(m);
   const xs=q.map(a=>a[0]),zs=q.map(a=>a[1]);blds.push({p:q,b:[Math.min(...xs),Math.max(...xs),Math.min(...zs),Math.max(...zs)]})}}
 const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
 W.add(new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:0x2b2f36,side:THREE.DoubleSide})));
 drawOff(items);snapRoad(0,0);spawnAI()}

const mm=$('mm'),mx=mm.getContext('2d'),off=document.createElement('canvas');off.width=off.height=800;
function drawOff(items){const o=off.getContext('2d');o.clearRect(0,0,800,800);o.save();o.translate(400,400);
 const path=p=>{o.beginPath();p.forEach((q,i)=>i?o.lineTo(q[0],q[1]):o.moveTo(q[0],q[1]))};
 o.fillStyle='rgba(150,160,180,.6)';for(const it of items)if(it.b){path(it.p);o.fill()}
 o.strokeStyle='#e2e8f0';o.lineCap=o.lineJoin='round';for(const it of items)if(it.r){o.lineWidth=Math.max(5,it.w*1.1);path(it.p);o.stroke()}
 o.restore()}
function drawMM(){const N=260,sc=.8;mx.clearRect(0,0,N,N);mx.save();mx.translate(N/2,N/2);mx.rotate(-c.h);mx.scale(sc,sc);mx.translate(-c.x,-c.z);
 mx.drawImage(off,-400,-400);mx.fillStyle='#fbbf24';for(const a of ai){mx.beginPath();mx.arc(a.x,a.z,8,0,7);mx.fill()}mx.restore();
 mx.fillStyle='#38bdf8';mx.beginPath();mx.moveTo(N/2,N/2-16);mx.lineTo(N/2+10,N/2+12);mx.lineTo(N/2,N/2+6);mx.lineTo(N/2-10,N/2+12);mx.fill()}

function snapRoad(x,z){let best=1e12,bx=0,bz=0,bh=c.h;
 for(const r of roads)for(let i=0;i<r.p.length-1;i++){const p=r.p[i],q=r.p[i+1],dx=q[0]-p[0],dz=q[1]-p[1],l2=dx*dx+dz*dz||1,
  t=Math.max(0,Math.min(1,((x-p[0])*dx+(z-p[1])*dz)/l2)),px=p[0]+dx*t,pz=p[1]+dz*t,d=(x-px)**2+(z-pz)**2;
  if(d<best){best=d;bx=px;bz=pz;const h=Math.atan2(dx,-dz),df=Math.atan2(Math.sin(h-c.h),Math.cos(h-c.h));bh=Math.abs(df)>Math.PI/2?h+Math.PI:h}}
 Object.assign(c,{x:bx,z:bz,h:bh,vx:0,vz:0,st:0,snap:1})}

function spawnAI(){ai.forEach(a=>S.remove(a.m));ai=[];const rr=roads.filter(r=>r.len>40);if(!rr.length)return;
 for(let n=0;n<16;n++){const r=rr[Math.random()*rr.length|0],a={r,i:Math.random()*(r.p.length-1)|0,t:0,d:Math.random()<.5?1:-1,s:7+Math.random()*7,m:mkCar(Math.random()*0xffffff)};
  ai.push(a);S.add(a.m);stepAI(a,0)}}
function stepAI(a,dt){const r=a.r,n=r.p.length-1;a.t+=a.d*a.s*dt;
 if(a.t>r.sl[a.i]){a.t-=r.sl[a.i];if(++a.i>=n){a.i=n-1;a.t=r.sl[a.i];a.d=-1}}
 else if(a.t<0){if(--a.i<0){a.i=0;a.t=0;a.d=1}else a.t+=r.sl[a.i]}
 const p=r.p[a.i],q=r.p[a.i+1],L=r.sl[a.i]||1,dx=(q[0]-p[0])/L*a.d,dz=(q[1]-p[1])/L*a.d;
 a.x=p[0]+(q[0]-p[0])*a.t/L-dz*1.8;a.z=p[1]+(q[1]-p[1])*a.t/L+dx*1.8;
 a.m.position.set(a.x,0,a.z);a.m.rotation.y=-Math.atan2(dx,-dz)}

function inPoly(x,z,p){let k=false;for(let i=0,j=p.length-1;i<p.length;j=i++)
 if((p[i][1]>z)!=(p[j][1]>z)&&x<(p[j][0]-p[i][0])*(z-p[i][1])/(p[j][1]-p[i][1])+p[i][0])k=!k;return k}

function phys(dt){
 const fx=Math.sin(c.h),fz=-Math.cos(c.h),rx=Math.cos(c.h),rz=Math.sin(c.h);
 let vf=c.vx*fx+c.vz*fz,vl=c.vx*rx+c.vz*rz;
 if(K.G)vf+=16*(1-Math.max(0,vf)/58)*dt*(vf<0?2:1);
 if(K.B)vf-=(vf>.5?32:9)*dt;
 vf=Math.max(-12,vf);vf-=vf*.25*dt+Math.sign(vf)*Math.min(Math.abs(vf),1.2*dt);
 if(K.H)vf-=Math.sign(vf)*Math.min(Math.abs(vf),16*dt);
 vl*=Math.exp(-(K.H?1.2:9)*dt);
 c.st+=((K.R-K.L)*.6/(1+Math.abs(vf)*.07)-c.st)*Math.min(1,8*dt);
 c.h+=vf/2.7*Math.tan(c.st)*dt*(K.H&&Math.abs(vf)>6?1.7:1);
 c.vx=vf*fx+vl*rx;c.vz=vf*fz+vl*rz;
 let nx=c.x+c.vx*dt,nz=c.z+c.vz*dt;
 for(const B of blds){if(nx<B.b[0]-1||nx>B.b[1]+1||nz<B.b[2]-1||nz>B.b[3]+1)continue;
  if(inPoly(nx,nz,B.p)){c.vx*=-.3;c.vz*=-.3;nx=c.x;nz=c.z;break}}
 for(const a of ai){const dx=nx-a.x,dz=nz-a.z;if(dx*dx+dz*dz<9){c.vx*=.6;c.vz*=.6;nx+=dx*.05;nz+=dz*.05}}
 c.x=nx;c.z=nz}

const MODES=['Chase','Hood','Drone'];let mode=0;
const cyc=()=>{mode=(mode+1)%3;$('cm').textContent='📷 '+MODES[mode]};$('cm').onclick=cyc;
const tgt=new THREE.Vector3();
function updCam(dt){const fx=Math.sin(c.h),fz=-Math.cos(c.h);P.visible=mode!==1;cam.up.set(0,1,0);
 if(mode===0){tgt.set(c.x-fx*8,3.6,c.z-fz*8);if(c.snap){cam.position.copy(tgt);c.snap=0}else cam.position.lerp(tgt,1-Math.exp(-7*dt));cam.lookAt(c.x+fx*6,1,c.z+fz*6)}
 else if(mode===1){cam.position.set(c.x+fx*.4,1.35,c.z+fz*.4);cam.lookAt(c.x+fx*30,1.2,c.z+fz*30)}
 else{cam.position.set(c.x,110,c.z);cam.up.set(fx,0,fz);cam.lookAt(c.x,0,c.z)}}

const st=$('st');
async function load(lat,lon){st.textContent='Loading…';let items;
 try{const q=`[out:json][timeout:25];(way["highway"~"^(motorway|trunk|primary|secondary|tertiary|residential|unclassified|living_street|service)$"](around:320,${lat},${lon});way["building"](around:320,${lat},${lon}););out geom;`;
  const r=await fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q));if(!r.ok)throw 0;
  items=parse(lat,lon,(await r.json()).elements);if(!items.some(i=>i.r))throw 0;st.textContent=lat.toFixed(4)+', '+lon.toFixed(4)}
 catch(e){items=fallback();st.textContent='No OSM data · sample grid'}
 build(items)}
function jump(){const m=$('ll').value.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
 if(!m)return st.textContent='Enter lat, lon';const la=+m[1],lo=+m[2];
 if(Math.abs(la)>85||Math.abs(lo)>180)return st.textContent='Out of range';load(la,lo);$('ll').blur()}
$('go').onclick=jump;$('ll').onkeydown=e=>{if(e.key==='Enter')jump()};

const KM={ArrowUp:'G',w:'G',ArrowDown:'B',s:'B',ArrowLeft:'L',a:'L',ArrowRight:'R',d:'R',' ':'H'},km=e=>KM[e.key.length>1?e.key:e.key.toLowerCase()];
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const m=km(e);
 if(m){K[m]=1;e.preventDefault()}else if(e.key==='r'||e.key==='R')snapRoad(c.x,c.z);else if(e.key==='c'||e.key==='C')cyc()});
addEventListener('keyup',e=>{const m=km(e);if(m)K[m]=0});
document.querySelectorAll('#ctl button').forEach(b=>{const k=b.dataset.k,
 on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}K[k]=1;b.classList.add('on')},
 up=()=>{K[k]=0;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up))});

let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;
 phys(dt);ai.forEach(a=>stepAI(a,dt));
 P.position.set(c.x,0,c.z);P.rotation.y=-c.h;updCam(dt);R.render(S,cam);
 const kmh=Math.hypot(c.vx,c.vz)*3.6,vf=c.vx*Math.sin(c.h)-c.vz*Math.cos(c.h);
 $('kmh').textContent=Math.round(kmh);$('gear').textContent=kmh<2?'N':vf<0?'R':Math.min(6,1+(kmh/32|0));
 drawMM();requestAnimationFrame(loop)}
load(40.7580,-73.9855);requestAnimationFrame(loop);
</script></body></html>
